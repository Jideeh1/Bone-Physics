name: Release

# Builds the extension zip and publishes a release tagged v<manifest version>.
# Run it from the Actions tab ("Run workflow"), or push a matching v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run solver tests
        run: |
          pip install numpy
          python -m unittest discover -s tests -v

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' bone_physics/blender_manifest.toml)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} != manifest v$version"; exit 1
          fi

      - name: Build extension zip
        run: python scripts/build_extension.py

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Bone Physics ${{ steps.version.outputs.tag }}
          files: dist/bone_physics-*.zip
          body_path: RELEASE_NOTES.md
          prerelease: true
